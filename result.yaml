instructions: "To configure colors with `tuxedo-rs` on NixOS, the recommended approach is to use the `tailor` CLI to manage profiles. Since `tailord` looks for configuration in `/etc/tailord/` and active profile in `/etc/tailord/active_profile.json`, you need to create a profile (e.g., `my_white.json` in `/etc/tailord/profiles/` and a corresponding keyboard color profile like `solid_white.json` in `/etc/tailord/keyboard/`) and then activate it with `tailor profile set <profile_name>`. The `tailor-gui` is also available if `hardware.tuxedo-rs.tailor-gui.enable = true;` is set in your configuration."
